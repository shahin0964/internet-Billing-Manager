name: Monthly Automatic Security Audit

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security_audit:
    name: Run Monthly Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Security Audit Script
        run: |
          chmod +x scripts/security_audit.py
          python scripts/security_audit.py
