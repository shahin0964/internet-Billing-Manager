name: Build Production APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'Production Release'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.keystore
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV

      - name: Determine Versioning
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            VER_NAME=$(echo "$TAG_NAME" | sed 's/^[vV]//')
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER_NAME"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            CALC_CODE=$((MAJOR * 100000 + MINOR * 1000 + PATCH * 10 + RUN_NUM))
            
            echo "VERSION_NAME=$VER_NAME" >> $GITHUB_ENV
            echo "VERSION_CODE=$CALC_CODE" >> $GITHUB_ENV
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            VER_NAME=$(grep -oP 'versionName\s*=\s*.*"([^"]+)"' app/build.gradle.kts | head -1 | grep -o '"[^"]*"' | tr -d '"')
            if [ -z "$VER_NAME" ]; then VER_NAME="1.0.23"; fi
            CALC_CODE=$(grep -oP 'versionCode\s*=\s*.*([0-9]+)' app/build.gradle.kts | head -1 | grep -o '[0-9]\+')
            if [ -z "$CALC_CODE" ]; then CALC_CODE="23"; fi
            
            echo "VERSION_NAME=$VER_NAME" >> $GITHUB_ENV
            echo "VERSION_CODE=$CALC_CODE" >> $GITHUB_ENV
            echo "tag_name=v$VER_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Generate Automatic Release Notes
        id: release_notes
        run: |
          mkdir -p release
          echo "Fetching git tags and history..."
          git fetch --tags --force || true

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"%s" 2>/dev/null || git log -n 15 --no-merges --pretty=format:"%s")
          else
            COMMITS=$(git log -n 15 --no-merges --pretty=format:"%s" 2>/dev/null || echo "")
          fi

          NOTES=""
          if [ -n "$COMMITS" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              
              if [[ "$line" =~ ^Merge || "$line" =~ ^chore\(release\) ]]; then
                continue
              fi

              CLEAN_LINE=$(echo "$line" | sed -E 's/^(feat|fix|refactor|style|docs|perf|test|chore|ci)(\([^\)]+\))?:\s*//i')
              FIRST_CHAR=$(echo "${CLEAN_LINE:0:1}" | tr '[:lower:]' '[:upper:]')
              REST_CHAR="${CLEAN_LINE:1}"
              CLEAN_LINE="${FIRST_CHAR}${REST_CHAR}"

              if [ -n "$CLEAN_LINE" ] && [[ ! "$NOTES" =~ "$CLEAN_LINE" ]]; then
                NOTES="${NOTES}• ${CLEAN_LINE}"$'\n'
              fi
            done <<< "$COMMITS"
          fi

          if [ -z "$NOTES" ]; then
            NOTES="• Improved app performance"$'\n'"• Fixed billing-related issues"$'\n'"• Improved backup and sync"$'\n'"• Improved app stability"
          fi

          {
            echo "What's New in ${VERSION_NAME}"
            echo ""
            echo "${NOTES}"
          } > release_notes.md

          echo "=== Generated Release Notes ==="
          cat release_notes.md
          echo "==============================="

      - name: Create .env file for secrets
        run: |
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" > .env

      - name: Build Release APK
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            export KEYSTORE_PATH="${{ github.workspace }}/release.keystore"
          fi
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease -PversionName="${VERSION_NAME}" -PversionCode="${VERSION_CODE}" --stacktrace
          else
            gradle :app:assembleRelease -PversionName="${VERSION_NAME}" -PversionCode="${VERSION_CODE}" --stacktrace
          fi

      - name: Locate and Prepare Output APK
        run: |
          mkdir -p app/build/outputs/apk/release
          mkdir -p release

          echo "Searching for final signed release APK..."
          FOUND_APK=""

          # Priority 1: Check standard AGP output directory for release APK
          if [ -d "app/build/outputs/apk/release" ]; then
            FOUND_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" ! -name "*unsigned*.apk" ! -name "*unaligned*.apk" ! -name "*debug*.apk" ! -name "ISP-Billing-Release.apk" | head -n 1)
          fi

          # Priority 2: Check all build/outputs/apk directories
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find . -type f -path "*/build/outputs/apk/*release/*.apk" ! -name "*unsigned*.apk" ! -name "*unaligned*.apk" ! -name "*debug*.apk" ! -name "ISP-Billing-Release.apk" | head -n 1)
          fi

          # Priority 3: Fallback check for any signed release APK in repo
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find . -type f -name "*.apk" ! -name "*unsigned*.apk" ! -name "*unaligned*.apk" ! -name "*debug*.apk" ! -name "ISP-Billing-Release.apk" | grep -i "release" | head -n 1)
          fi

          if [ -z "$FOUND_APK" ]; then
            echo "ERROR: No signed production release APK found in build outputs!"
            echo "Listing build output directory contents for diagnosis:"
            find app/build/outputs/ || true
            exit 1
          fi

          echo "Discovered production release APK at: $FOUND_APK"
          cp "$FOUND_APK" "release/ISP-Billing-Release.apk"
          cp "$FOUND_APK" "app/build/outputs/apk/release/ISP-Billing-Release.apk"

      - name: Verify Release APK
        run: |
          APK_PATH="release/ISP-Billing-Release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Final production APK file missing at $APK_PATH!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH" || stat -f%z "$APK_PATH")
          echo "Production APK File Size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "ERROR: Generated APK size ($FILE_SIZE bytes) is too small and appears incomplete or invalid!"
            exit 1
          fi

          echo "Testing APK ZIP archive integrity..."
          unzip -t "$APK_PATH" > /dev/null || {
            echo "ERROR: APK archive integrity check failed (corrupt ZIP file)!"
            exit 1
          }

          echo "Inspecting Package Identity and Versioning via AAPT..."
          AAPT_BIN=""
          if [ -d "$ANDROID_HOME/build-tools" ]; then
            AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -name "aapt2" -o -name "aapt" | sort -V | tail -n 1)
          fi

          if [ -n "$AAPT_BIN" ] && [ -x "$AAPT_BIN" ]; then
            echo "Using AAPT binary: $AAPT_BIN"
            BADGING_OUTPUT=$("$AAPT_BIN" dump badging "$APK_PATH" 2>/dev/null || true)
            if [ -n "$BADGING_OUTPUT" ]; then
              PKG_NAME=$(echo "$BADGING_OUTPUT" | grep -oP "package: name='\K[^']+" || true)
              VER_CODE=$(echo "$BADGING_OUTPUT" | grep -oP "versionCode='\K[^']+" || true)
              VER_NAME=$(echo "$BADGING_OUTPUT" | grep -oP "versionName='\K[^']+" || true)
              echo "Package Name: $PKG_NAME"
              echo "Version Code: $VER_CODE"
              echo "Version Name: $VER_NAME"

              if [ -z "$PKG_NAME" ]; then
                echo "ERROR: Could not parse package name from APK!"
                exit 1
              fi

              if [ "$PKG_NAME" != "com.aistudio.ispbilling.control" ]; then
                echo "ERROR: Package name ($PKG_NAME) does not match com.aistudio.ispbilling.control!"
                exit 1
              fi

              if [ -n "$VERSION_NAME" ] && [ "$VER_NAME" != "$VERSION_NAME" ]; then
                echo "ERROR: Built APK versionName ($VER_NAME) does not match expected VERSION_NAME ($VERSION_NAME)!"
                exit 1
              fi

              if [ -n "$VERSION_CODE" ] && [ "$VER_CODE" != "$VERSION_CODE" ]; then
                echo "ERROR: Built APK versionCode ($VER_CODE) does not match expected VERSION_CODE ($VERSION_CODE)!"
                exit 1
              fi
            fi
          else
            echo "AAPT not found in build-tools; skipping badging dump."
          fi

          echo "Verifying Release APK Signature..."
          APKSIGNER=""
          if [ -d "$ANDROID_HOME/build-tools" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          fi

          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Using apksigner: $APKSIGNER"
            SIGN_VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose "$APK_PATH" 2>&1)
            VERIFY_STATUS=$?
            echo "$SIGN_VERIFY_OUTPUT"
            if [ $VERIFY_STATUS -ne 0 ]; then
              echo "ERROR: Production APK signature verification failed with apksigner!"
              exit 1
            fi
          else
            echo "apksigner not found; falling back to jarsigner..."
            jarsigner -verify -verbose -certs "$APK_PATH" || {
              echo "ERROR: Production APK signature verification failed with jarsigner!"
              exit 1
            }
          fi

          echo "SUCCESS: Production APK structure, package identity, and signature verification passed!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISP-Billing-APK
          path: release/ISP-Billing-Release.apk

      - name: Release Diagnostics
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "=== GitHub Release Diagnostics ==="
          echo "Repository: ${{ github.repository }}"
          echo "Release Tag: ${{ steps.versioning.outputs.tag_name }}"
          echo "APK Filename: ISP-Billing-Release.apk"
          echo "APK Path: release/ISP-Billing-Release.apk"
          if [ -f "release/ISP-Billing-Release.apk" ]; then
            SIZE=$(stat -c%s release/ISP-Billing-Release.apk || stat -f%z release/ISP-Billing-Release.apk)
            echo "APK File Size: $SIZE bytes"
          else
            echo "ERROR: Production APK release/ISP-Billing-Release.apk does not exist!"
            exit 1
          fi
          echo "================================="

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: release/ISP-Billing-Release.apk
          name: ${{ github.event.inputs.release_title || steps.versioning.outputs.tag_name }}
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
